name: Tests

on:
  push:
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Rules, balance, packs, AI matchups, NPC ladder, saves
        # timeout: a script that fails to parse never calls quit(), so fail fast instead of hanging
        run: timeout 1200 ~/godot/godot --headless --path . res://tests/test_runner.tscn

      - name: Scene smoke test (every screen + autopilot battles)
        run: timeout 900 ~/godot/godot --headless --path . res://tests/smoke_test.tscn
